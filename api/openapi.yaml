openapi: 3.1.0
info:
  title: AUSTRO OS API
  version: v1.0.0
  description: |
    AUSTRO OS - AI Content Operating System
    Every endpoint references a constitutional principle for enforcement.
servers:
  - url: http://localhost:8080
    description: Development server
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Checks if the application is alive
      operationId: healthLive
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ["ok"]
  /health/ready:
    get:
      summary: Readiness probe
      description: Checks if the application is ready to serve traffic
      operationId: healthReady
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
  /api/auth/bootstrap:
    post:
      summary: Initialize the founder identity
      description: |
        Creates the single founder identity from the deployment configuration
        (AUSTRO_FOUNDER_USERNAME / AUSTRO_FOUNDER_PASSWORD). Succeeds exactly
        once; returns 409 once a founder exists or when bootstrap is not
        configured. There is no arbitrary self-registration.
      operationId: authBootstrap
      responses:
        '201':
          description: Founder initialized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ["initialized"]
        '409':
          description: Already initialized or not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 12 — Human Oversight
  /api/auth/login:
    post:
      summary: Authenticate with username and password
      description: |
        Issues an access token (15 minutes) and a refresh token (30 days,
        rotation enabled). Failures are uniform: they never reveal whether the
        username or the password was wrong.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
  /api/auth/refresh:
    post:
      summary: Rotate a refresh token
      description: |
        Validates the presented refresh token, rejects reused or revoked
        tokens, rotates it, and re-issues an access token for the same identity.
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid, reused or revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
  /api/auth/logout:
    post:
      summary: Revoke a refresh token
      description: Terminates the session held by the presented refresh token. Idempotent.
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Session terminated
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
  /api/me:
    get:
      summary: Current user profile
      description: |
        Returns the authenticated caller's safe profile, including the identity's
        authorization role (founder | workspace_admin | workspace_member). The
        role is read from the persisted identity at token-issuance time; it is
        never accepted from the client.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
  /workspaces:
    get:
      summary: List workspaces
      description: |
        Organization-level workspace listing. Explicitly founder-only: a founder
        may enumerate every workspace in the organization; a workspace_admin may
        not (it reaches only its own workspace through GET /workspaces/{id})
        and a workspace_member is denied. There is no client-supplied workspace
        context for this operation.
      operationId: listWorkspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 1 — Vision First
        - Principle 9 — Security by Design
    post:
      summary: Create workspace
      description: |
        Create a new workspace. Explicitly founder-only and organization-level:
        only the founder carries the permission, so workspace_admin and
        workspace_member identities are denied. The name is required, trimmed
        and bounded to 100 characters; unknown request fields (including any
        client-supplied workspace_id) are rejected. A duplicate name returns a
        deterministic 409 conflict.
      operationId: createWorkspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Workspace name
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Workspace name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 1 — Vision First
        - Principle 5 — Modular Design
  /workspaces/{id}:
    get:
      summary: Get workspace
      description: |
        Read a workspace by id. A workspace_admin may read only its own
        workspace: the workspace in the path must equal the admin's verified
        token workspace and never comes from a client-controlled source. A
        workspace_member is denied. A founder's organization-level read is
        explicit.
      operationId: getWorkspace
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Invalid workspace id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
  /audit/events:
    get:
      summary: List audit events (organization scope)
      description: |
        A bounded, newest-first page of the append-only audit chain across the
        whole organization. Founder only: this read is served from the
        administrative database role, the only principal audit_org_policy names,
        so no other role can hold it without creating a cross-tenant read the
        database itself would not refuse.

        The response omits the chain hash, the digital signature, and the
        free-form outcome_details and permissions_checked columns. Those are
        internal, and the JSONB pair is unbounded writer-controlled text, which
        is exactly where a caller's input or an error string would land.

        Pagination is by seq, which is unique and monotonic, so the ordering is
        total and a cursor can neither skip nor repeat a row. limit is clamped
        to 200. Unknown query parameters are rejected rather than ignored, so a
        misspelled filter cannot silently return an unfiltered page.
      operationId: listAuditEventsOrg
      security:
        - bearerAuth: []
      parameters:
        - name: event_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: actor_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 50
        - name: before_seq
          in: query
          required: false
          description: Pagination cursor. Returns only events with a lower seq.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: One page of audit events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          description: Malformed or unsupported filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the founder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 11 — Human Oversight
        - Principle 9 — Security by Design
  /audit/verification:
    get:
      summary: Verify the audit hash chain
      description: |
        Re-reads the persisted chain and recomputes every link, reporting
        whether it is intact and how many events were checked. The check is
        independent of anything the writer remembers, so it detects an edit made
        behind the application's back.

        Founder only, and expensive by nature: it reads the whole table, because
        a bounded proof of a hash chain is not a thing. It is meant to be run
        deliberately, not polled.
      operationId: verifyAuditChain
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Result of the whole-chain integrity check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the founder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 11 — Human Oversight
        - Principle 9 — Security by Design
  /workspaces/{id}/audit/events:
    get:
      summary: List audit events for one workspace
      description: |
        A bounded, newest-first audit page for a single workspace.

        A founder may name any workspace. A workspace_admin or workspace_member
        is confined to the workspace in their verified token: the path id must
        equal it, and the read runs on the unprivileged runtime connection with
        app.current_workspace bound, so audit_workspace_policy enforces the
        boundary in PostgreSQL rather than in the handler. A diverging path is
        refused, not silently rewritten.
      operationId: listAuditEventsForWorkspace
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: event_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: actor_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 50
        - name: before_seq
          in: query
          required: false
          description: Pagination cursor. Returns only events with a lower seq.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: One page of audit events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          description: Malformed id or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller may not read this workspace's audit history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 10 — Privacy by Design
        - Principle 11 — Human Oversight
  /tasks:
    post:
      summary: Create a task
      description: |
        Creates a task in the caller's own workspace.

        The workspace is never taken from the request: it comes from the verified
        token, and the store binds it as app.current_workspace so
        workspace_isolation_policy confines the insert in PostgreSQL. A new task
        is always `backlog`; there is no status field here, because letting a
        caller choose the initial state would bypass the lifecycle.

        A founder has no workspace and is therefore refused. That is deliberate:
        users_founder_no_workspace makes the absence a database invariant, and
        granting a cross-workspace write would be a privilege the model does not
        define.
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Missing or oversized title, oversized description, or unknown priority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 1 — Vision First
        - Principle 9 — Security by Design
    get:
      summary: List tasks
      description: |
        A bounded, newest-first page of the caller's tasks.

        Ordering is (created_at, id) descending. created_at alone would not be a
        total order -- two tasks created within the same microsecond would tie --
        so the primary key breaks the tie and the page boundary is never
        arbitrary. Pagination is keyset rather than offset, so a concurrent
        insert cannot shift rows under the reader and cause a page to be skipped
        or repeated.

        The page size is clamped to 200 rather than rejected, and an unrecognized
        query parameter is refused rather than ignored: a misspelled filter
        should not silently return an unfiltered page that looks like it worked.
      operationId: listTasks
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Restrict to one lifecycle stage.
          schema:
            type: string
            enum:
              - backlog
              - planned
              - in_progress
              - in_review
              - completed
              - cancelled
              - rejected
              - failed
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: |
            Keyset cursor from a previous page's next_cursor. Only tasks sorting
            strictly after it are returned. A cursor this API did not issue is
            rejected rather than treated as "start over".
          schema:
            type: string
      responses:
        '200':
          description: One page of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          description: Unknown parameter, malformed limit, unknown status, or invalid cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 13 — Observability
  /tasks/{id}:
    get:
      summary: Read one task
      description: |
        Returns a single task. The id is the task, not a workspace: it is
        resolved only inside the caller's own workspace, so an id belonging to
        another tenant is not found rather than forbidden, and neither outcome
        reveals whether the task exists.
      operationId: getTask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Malformed task id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such task in the caller's workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
    patch:
      summary: Update task fields
      description: |
        Updates the non-lifecycle fields of a task: title, description, priority,
        assignee and deadline.

        Status is deliberately not among them. A lifecycle move is validated
        against the task's current state, and a field update has no way to
        perform that check, so allowing status here would let a PATCH smuggle a
        transition past the rules the transition route enforces.

        Every field is optional and absent means unchanged, so a partial update
        cannot clear a field the caller did not mention.
      operationId: updateTask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: The updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Blank or oversized title, oversized description, or an invalid priority, assignee or deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such task in the caller's workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 4 — Quality Over Speed
  /tasks/{id}/transition:
    post:
      summary: Transition a task to the next lifecycle stage
      description: |
        Applies exactly one lifecycle move, validated server-side.

        The request names only the destination. The current status is read from
        the database inside the same operation and task.CanTransition decides
        whether the move is legal, so a client cannot assert a starting state the
        task is not in, and cannot reach a status the lifecycle does not define.

        The permitted destinations for a task are returned on the task itself,
        computed from the same table the server enforces. They are a convenience
        derived from that authority, never the authority: the server re-checks on
        every request.

        `completed`, `cancelled`, `failed` and `rejected` are terminal; no
        transition out of them is permitted.
      operationId: transitionTask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionTaskRequest'
      responses:
        '200':
          description: The task after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: |
            Missing or unknown status, or a transition the lifecycle does not
            allow from the task's current state, including any move out of a
            terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such task in the caller's workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 11 — Human Oversight
        - Principle 4 — Quality Over Speed
  /knowledge:
    post:
      summary: Create a knowledge document
      description: |
        Creates a document in the caller's own workspace.

        The workspace is never taken from the request: it comes from the verified
        token, and the store binds it as app.current_workspace so
        workspace_isolation_policy confines the insert in PostgreSQL.

        The content is embedded server-side before it is stored. No vector is
        accepted from the client, because a caller-supplied embedding would let
        one workspace plant a document that another workspace's similarity search
        retrieves -- which is precisely the isolation the column exists to serve.
        If embedding fails, nothing is persisted.

        `kind` is optional and defaults to `document`. A founder has no workspace
        and is therefore refused.
      operationId: createKnowledgeDocument
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeRequest'
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        '400': >-
          Missing or oversized title, blank or oversized content, unknown kind,
          unknown field, or a body over the request-size bound
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Embedding or persistence failed; nothing was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 1 — Vision First
        - Principle 9 — Security by Design
    get:
      summary: List knowledge documents
      description: |
        A bounded, newest-first page of the caller's documents.

        Ordering is (created_at, id) descending. created_at alone would not be a
        total order -- two documents written within the same microsecond would
        tie -- so the primary key breaks the tie and the page boundary is never
        arbitrary. Pagination is keyset rather than offset, so a concurrent insert
        cannot shift rows under the reader and cause a page to be skipped or
        repeated.

        The page size is clamped to 200 rather than rejected, and the effective
        value is reported. An unrecognized query parameter is refused rather than
        ignored: a caller who misspells `cursor` and is silently handed the first
        page would believe it had paged forward. The query string is parsed
        explicitly, so a malformed one is a 400 rather than a request served with
        a parameter silently dropped.
      operationId: listKnowledgeDocuments
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Restrict to one document kind
          schema:
            type: string
            enum: [document, campaign_rule, style_guide]
        - name: limit
          in: query
          required: false
          description: Page size, clamped to a maximum of 200
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Keyset cursor from a previous page's next_cursor
          schema:
            type: string
      responses:
        '200':
          description: One page of documents, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePage'
        '400':
          description: Unknown query parameter, malformed cursor, non-integer limit, or unknown kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 13 — Observability
        - Principle 10 — Privacy by Design
  /knowledge/{id}:
    get:
      summary: Read a knowledge document
      description: |
        Returns one document from the caller's workspace.

        A document owned by another workspace answers 404 rather than 403. The
        identifier is the document, not the workspace, so answering 403 would
        confirm to another tenant that the document exists.

        The embedding is not returned: it is storage mechanics rather than part
        of the document a reader wants, and omitting it keeps the response small.
      operationId: getKnowledgeDocument
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        '400':
          description: Malformed document id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such document in the caller's workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 10 — Privacy by Design
    patch:
      summary: Update a knowledge document
      description: |
        Updates the title, content or kind of a document in the caller's
        workspace.

        Every field is optional, and an omitted field is left unchanged rather
        than cleared. A request naming no field at all is a 400, not a silent
        no-op, because returning 200 would tell the caller something was written
        when nothing was.

        Changing the content re-embeds the document, so similarity search ranks
        what is actually stored. A title-only edit does not spend an embedding
        call, because the vector is a function of the content alone.

        This is a real UPDATE, not the create path's INSERT ... ON CONFLICT: a
        document deleted between the read and the write is reported not found
        rather than silently recreated.
      operationId: updateKnowledgeDocument
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeRequest'
      responses:
        '200':
          description: The updated document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        '400': >-
          No field supplied, blank title or content, oversized content, unknown
          kind, or unknown field
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such document in the caller's workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Re-embedding or persistence failed; the document is unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 4 — Quality Over Speed
        - Principle 9 — Security by Design
    delete:
      summary: Delete a knowledge document
      description: |
        Removes a document from the caller's workspace.

        The knowledge domain has no archive flag or status column, so deletion is
        its only retirement path; unlike tasks, which retire through a terminal
        lifecycle status, there is no softer state to move a document into. The
        browser application confirms before issuing this request.

        Deleting a document owned by another workspace answers 404 and removes
        nothing.
      operationId: deleteKnowledgeDocument
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document removed
        '400':
          description: Malformed document id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such document in the caller's workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
  /knowledge/search:
    post:
      summary: Search knowledge by similarity
      description: |
        Returns the caller's documents nearest to the query text.

        The query is embedded server-side using the same provider and dimension
        as the stored documents, then ranked by cosine distance in SQL against
        rows the workspace policy already confines. No vector is accepted from
        the client, and the ranking cannot widen the search beyond the caller's
        own workspace.

        A POST is used rather than a GET because the query is a body to be
        embedded, not a URL-addressable resource.

        The limit is clamped to 50, and a value outside that range is rejected
        rather than silently replaced with a default -- substituting a default
        would hide the caller's mistake.
      operationId: searchKnowledge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchKnowledgeRequest'
      responses:
        '200':
          description: Nearest documents, best match first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResult'
        '400':
          description: Empty or oversized query, unknown kind, or limit out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Embedding the query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 10 — Privacy by Design
        - Principle 9 — Security by Design

  /memory/{layer}/{key}:
    get:
      summary: Read one memory cell
      description: |
        Reads exactly one key from the caller's workspace. The workspace is
        derived from the verified bearer claims; there is no workspace path,
        query parameter, or request field that can override it. Only the exact
        lower-case layers session, longterm and workspace are public.
      operationId: readMemory
      security:
        - bearerAuth: []
      parameters:
        - name: layer
          in: path
          required: true
          schema:
            type: string
            enum: [session, longterm, workspace]
        - name: key
          in: path
          required: true
          description: Non-blank memory key, at most 256 bytes.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: The requested memory cell
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryReadResponse'
        '400':
          description: Invalid layer, key, or query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no supported workspace-bound role or workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No memory cell exists for this workspace, layer and key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Memory storage or audit persistence failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 10 — Privacy by Design
        - Principle 9 — Security by Design
    put:
      summary: Create or replace one memory cell
      description: |
        Creates or replaces exactly one key in the caller's workspace. The
        request body contains only the value and optional TTL; workspace, actor,
        role and authorization scope are server-derived and unknown fields are
        rejected. This operation is idempotent for a workspace, layer and key.
      operationId: writeMemory
      security:
        - bearerAuth: []
      parameters:
        - name: layer
          in: path
          required: true
          schema:
            type: string
            enum: [session, longterm, workspace]
        - name: key
          in: path
          required: true
          description: Non-blank memory key, at most 256 bytes.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryWriteRequest'
      responses:
        '200':
          description: The stored memory cell
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryWriteResponse'
        '400':
          description: Invalid JSON, unknown field, layer, key, value, secret-shaped content, or TTL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller has no supported workspace-bound role or workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Per-workspace memory write limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Memory storage or audit persistence failed; the mutation fails closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design

  /publications:
    post:
      summary: Queue a publication draft
      operationId: createPublication
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '201':
          description: Queued publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      principles:
        - Principle 1 — Vision First
    get:
      summary: List publications in the caller workspace
      operationId: listPublications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [queued, review, approved, published, failed, rejected, cancelled]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Bounded deterministic publication page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      principles:
        - Principle 10 — Privacy by Design
  /publications/{id}:
    get:
      summary: Get one publication status
      operationId: getPublication
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationID'
      responses:
        '200':
          description: Publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      principles:
        - Principle 10 — Privacy by Design
  /publications/{id}/submit:
    post:
      summary: Submit a queued publication for review
      operationId: submitPublication
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationID'
      responses:
        '200':
          description: Publication in review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
