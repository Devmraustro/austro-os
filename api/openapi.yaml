      summary: Approve a publication as a workspace admin
      operationId: approvePublication
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationID'
      responses:
        '200':
          description: Approved publication
          content:
            application/json:
