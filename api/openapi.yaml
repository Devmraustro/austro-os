  /publications/{id}/retry:
    post:
      summary: Retry a failed publication delivery
      operationId: retryPublication
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationID'
      responses:
        '200':
          description: Recovered and published publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Retry failed; the publication remains failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 11 — Human Oversight
components:
  parameters:
    PublicationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreatePublicationRequest:
      type: object
      additionalProperties: false
      required: [title, body, platform]
      properties:
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 10000
        platform:
          type: string
          maxLength: 64
    Publication:
      type: object
      required: [id, workspace_id, title, body, platform, status, content_hash, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        platform:
          type: string
        status:
          type: string
          enum: [queued, review, approved, published, failed, rejected, cancelled]
        content_hash:
          type: string
        idempotency_key:
          type: string
        external_reference:
          type: string
        failure_reason:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        rejected_by:
          type: string
        rejected_at:
          type: string
          format: date-time
        published_by:
          type: string
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicationList:
      type: object
      required: [publications, count, limit]
      properties:
        publications:
          type: array
          items:
            $ref: '#/components/schemas/Publication'
        count:
          type: integer
        limit:
          type: integer
    MemoryReadResponse:
      type: object
      additionalProperties: false
      required: [layer, key, value, workspace_id]
      properties:
        layer:
          type: string
          enum: [session, longterm, workspace]
        key:
          type: string
        value:
          type: string
        workspace_id:
          type: string
          format: uuid
          description: Derived by the server from the verified caller claims.
    MemoryWriteRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          maxLength: 65536
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 7776000
          default: 86400
    MemoryWriteResponse:
      type: object
      additionalProperties: false
      required: [layer, key, value, workspace_id, ttl_seconds]
      properties:
        layer:
          type: string
          enum: [session, longterm, workspace]
        key:
          type: string
        value:
          type: string
        workspace_id:
          type: string
          format: uuid
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 7776000

    KnowledgeDocument:
      type: object
      description: |-
        A workspace-scoped knowledge document.

        The embedding is deliberately absent. It is server-derived storage
        mechanics rather than part of the document a reader wants, and returning
        it would invite a client to treat it as data it may set.
      required: [id, workspace_id, kind, title, content, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
          description: Stamped by the server from the verified token
        kind:
          type: string
          enum: [document, campaign_rule, style_guide]
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgePage:
      type: object
      description: One bounded page of documents, newest first.
      required: [documents, limit]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeDocument'
        next_cursor:
          type: string
          description: |-
            Cursor for the following page. Absent on the last page, which is how
            the caller knows the walk is finished rather than inferring it from a
            page that happened to come back full.
        limit:
          type: integer
          description: The page size actually applied, which may be below the one requested
    KnowledgeSearchResult:
      type: object
      description: Similarity search results, best match first.
      required: [documents, count]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeDocument'
        count:
          type: integer
    CreateKnowledgeRequest:
      type: object
      description: |-
        A new document. Only the title and content are required; kind defaults
        to document. There is no embedding field, and an unknown field is
        rejected rather than ignored.
      required: [title, content]
      properties:
        kind:
          type: string
          enum: [document, campaign_rule, style_guide]
          default: document
        title:
          type: string
          maxLength: 300
        content:
          type: string
          maxLength: 65536
    UpdateKnowledgeRequest:
      type: object
      description: |-
        A partial update. Every field is optional and an omitted field is left
        unchanged; at least one must be present.
      properties:
        kind:
          type: string
          enum: [document, campaign_rule, style_guide]
        title:
          type: string
          maxLength: 300
        content:
          type: string
          maxLength: 65536
    SearchKnowledgeRequest:
      type: object
      description: A similarity query. The text is embedded server-side.
      required: [query]
      properties:
        query:
          type: string
          maxLength: 2000
        kind:
          type: string
          enum: [document, campaign_rule, style_guide]
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
    Task:
      type: object
      description: |
        A unit of work, always owned by exactly one workspace.

        `transitions` lists the states this task may legally move to next,
        computed server-side from the same lifecycle table the transition route
        enforces. It exists so a client cannot offer a control the server would
        refuse; it is derived from the authority and is never the authority.
      required:
        - id
        - workspace_id
        - title
        - status
        - priority
        - created_at
        - updated_at
        - transitions
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
          description: The owning tenant. Derived server-side; never accepted from a client.
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        status:
          type: string
          enum:
            - backlog
            - planned
            - in_progress
            - in_review
            - completed
            - cancelled
            - rejected
            - failed
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assignee_type:
          type: string
          enum: [ai_employee, human]
        assignee_id:
          type: string
          format: uuid
        deadline:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        transitions:
          type: array
          description: |
            Lifecycle states reachable from the current one. Empty for a task in
            a terminal state.
          items:
            type: string
            enum:
              - backlog
              - planned
              - in_progress
              - in_review
              - completed
              - cancelled
              - rejected
              - failed
    TaskPage:
      type: object
      required:
        - tasks
        - limit
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor:
          type: string
          description: |
            Pass as `cursor` to fetch the following page. Absent on the last
            page, which is how a client knows it has finished.
        limit:
          type: integer
          description: The page size actually applied, which may be less than requested.
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        priority:
          type: string
          enum: [low, normal, high, urgent]
          description: Omitted means normal.
    UpdateTaskRequest:
      type: object
      description: |
        Every field is optional; an absent field is left unchanged. Status is not
        accepted here at all -- see the transition operation.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assignee_type:
          type: string
          enum: [ai_employee, human]
        assignee_id:
          type: string
          format: uuid
        deadline:
          type: string
          format: date-time
    TransitionTaskRequest:
      type: object
      description: |
        Names only the destination. The origin is read from the database, so a
        client cannot claim a starting state the task is not in.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - backlog
            - planned
            - in_progress
            - in_review
            - completed
            - cancelled
            - rejected
            - failed
    AuditEventView:
      type: object
      description: |
        One audit event as exposed to clients. Deliberately narrower than the
        stored row: the chain hash, digital signature, outcome_details and
        permissions_checked are withheld, because the first two are internal
        cryptographic material and the second two are unbounded
        writer-controlled JSON.
      required:
        - seq
        - event_id
        - timestamp
        - actor_type
        - target_type
        - event_type
        - outcome
        - constitutional_principle
      properties:
        seq:
          type: integer
          format: int64
          description: Chain position. Unique and monotonic; also the page cursor.
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: The canonical instant the hash chain binds.
        workspace_id:
          type: string
          format: uuid
          nullable: true
        trace_id:
          type: string
          format: uuid
          nullable: true
        span_id:
          type: string
          format: uuid
          nullable: true
        actor_type:
          type: string
        actor_id:
          type: string
          format: uuid
          nullable: true
        target_type:
          type: string
        target_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
        outcome:
          type: string
        constitutional_principle:
          type: string
        genesis:
          type: boolean
          description: True only for the chain root.
    AuditPage:
      type: object
      required:
        - events
        - limit
      properties:
        events:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AuditEventView'
        next_cursor:
          type: string
          description: |
            seq to pass as before_seq for the next page. Absent when the page
            was short enough to be the last one.
        limit:
          type: integer
          description: The effective page size after clamping.
    AuditVerification:
      type: object
      required:
        - verified
        - events_checked
      properties:
        verified:
          type: boolean
          description: True when every link in the persisted chain recomputes.
        events_checked:
          type: integer
          description: How many events the check covered.
        head_seq:
          type: integer
          format: int64
          description: Chain position of the newest event, when any exists.
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Bearer access token (15 minute lifetime)
        token_type:
          type: string
          enum: ["bearer"]
        expires_in:
          type: integer
          description: Access token lifetime in seconds
        refresh_token:
          type: string
          description: Rotation-enabled refresh token
    MeResponse:
      type: object
      description: |
        The authenticated caller's safe profile. Only profile fields and the
        identity's authorization role are returned; password hashes,
        refresh-token material and internal database fields are never exposed.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: ["founder", "workspace_admin", "workspace_member"]
        is_founder:
          type: boolean
        workspace_id:
          type: string
          format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
