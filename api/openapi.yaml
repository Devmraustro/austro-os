openapi: 3.1.0
info:
  title: AUSTRO OS API
  version: v1.0.0
  description: |
    AUSTRO OS - AI Content Operating System
    Every endpoint references a constitutional principle for enforcement.
servers:
  - url: http://localhost:8080
    description: Development server
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Checks if the application is alive
      operationId: healthLive
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ["ok"]
  /health/ready:
    get:
      summary: Readiness probe
      description: Checks if the application is ready to serve traffic
      operationId: healthReady
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
  /api/auth/bootstrap:
    post:
      summary: Initialize the founder identity
      description: |
        Creates the single founder identity from the deployment configuration
        (AUSTRO_FOUNDER_USERNAME / AUSTRO_FOUNDER_PASSWORD). Succeeds exactly
        once; returns 409 once a founder exists or when bootstrap is not
        configured. There is no arbitrary self-registration.
      operationId: authBootstrap
      responses:
        '201':
          description: Founder initialized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ["initialized"]
        '409':
          description: Already initialized or not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 12 — Human Oversight
  /api/auth/login:
    post:
      summary: Authenticate with username and password
      description: |
        Issues an access token (15 minutes) and a refresh token (30 days,
        rotation enabled). Failures are uniform: they never reveal whether the
        username or the password was wrong.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
  /api/auth/refresh:
    post:
      summary: Rotate a refresh token
      description: |
        Validates the presented refresh token, rejects reused or revoked
        tokens, rotates it, and re-issues an access token for the same identity.
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid, reused or revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
  /api/auth/logout:
    post:
      summary: Revoke a refresh token
      description: Terminates the session held by the presented refresh token. Idempotent.
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Session terminated
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
  /api/me:
    get:
      summary: Current user profile
      description: |
        Returns the authenticated caller's safe profile, including the identity's
        authorization role (founder | workspace_admin | workspace_member). The
        role is read from the persisted identity at token-issuance time; it is
        never accepted from the client.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
  /workspaces:
    get:
      summary: List workspaces
      description: List all workspaces accessible to the current user
      operationId: listWorkspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
      principles:
        - Principle 1 — Vision First
        - Principle 9 — Security by Design
  /workspaces:
    post:
      summary: Create workspace
      description: Create a new workspace
      operationId: createWorkspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
      principles:
        - Principle 1 — Vision First
        - Principle 5 — Modular Design
  /workspaces/{id}:
    get:
      summary: Get workspace
      description: Get workspace by ID
      operationId: getWorkspace
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
      principles:
        - Principle 9 — Security by Design
        - Principle 10 — Privacy by Design
  /departments:
    get:
      summary: List departments
      description: List departments in a workspace
      operationId: listDepartments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
      principles:
        - Principle 9 — Security by Design
  /departments:
    post:
      summary: Create department
      description: Create a department in a workspace
      operationId: createDepartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                workspaceId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Department created
      principles:
        - Principle 5 — Modular Design
  /teams:
    get:
      summary: List teams
      description: List teams in a department
      operationId: listTeams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of teams
      principles:
        - Principle 9 — Security by Design
  /ai-employees:
    get:
      summary: List AI employees
      description: List AI employees in a team
      operationId: listAIEmployees
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of AI employees
      principles:
        - Principle 9 — Security by Design
  /audit/events:
    post:
      summary: Create audit event
      description: Create a new audit event with hash chain and digital signature
      operationId: createAuditEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventType
                - actorType
                - targetType
                - constitutionalPrinciple
              properties:
                eventType:
                  type: string
                actorType:
                  type: string
                actorId:
                  type: string
                targetType:
                  type: string
                targetId:
                  type: string
                outcome:
                  type: string
                constitutionalPrinciple:
                  type: string
                traceId:
                  type: string
                spanId:
                  type: string
      responses:
        '201':
          description: Audit event created
      principles:
        - Principle 13 — Observability
        - Principle 18 — Founder Authority
  /audit/events/{traceId}:
    get:
      summary: List audit events by trace
      description: Retrieve audit events for a given trace ID
      operationId: listEventsByTrace
      security:
        - bearerAuth: []
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of audit events
      principles:
        - Principle 13 — Observability
  /constitutional/principles:
    get:
      summary: List constitutional principles
      description: List all registered constitutional principles
      operationId: listPrinciples
      responses:
        '200':
          description: List of principles
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      principles:
        - Principle 13 — Observability
  /constitutional/principles/{name}:
    get:
      summary: Get principle details
      description: Get details of a specific constitutional principle
      operationId: getPrinciple
      responses:
        '200':
          description: Principle details
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
      principles:
        - Principle 13 — Observability
components:
  schemas:
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        department_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    AIEmployee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        team_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        capabilities:
          type: array
          items:
            type: string
        permissions:
          type: object
        memory_id:
          type: string
          format: uuid
        current_task_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      description: |
        Universal audit event with hash chain and digital signature.
        The hash chain uses GENESIS_HASH for the first event; subsequent events
        chain from the previous event's hash_value.
      required:
        - event_id
        - timestamp
        - actor_type
        - target_type
        - event_type
        - outcome
        - constitutional_principle
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
          format: uuid
        span_id:
          type: string
          format: uuid
        actor_type:
          type: string
        actor_id:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        event_type:
          type: string
        outcome:
          type: string
        outcome_details:
          type: object
        permissions_checked:
          type: object
        constitutional_principle:
          type: string
          enum:
            - Vision First
            - Architecture Before Implementation
            - Documentation Is Part of the Product
            - Quality Over Speed
            - Modular Design
            - Replaceability
            - Separation of Concerns
            - AI Independence
            - Security by Design
            - Privacy by Design
            - Human Oversight
            - Continuous Improvement
            - Observability
            - Backward Compatibility
            - Simplicity
            - Scalability
            - Explicit Decisions
            - Founder Authority
        digital_signature:
          type: string
          format: base64
        hash_chain_parent:
          type: string
          format: uuid
        hash_chain_value:
          type: string
          format: byte
        genesis:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Bearer access token (15 minute lifetime)
        token_type:
          type: string
          enum: ["bearer"]
        expires_in:
          type: integer
          description: Access token lifetime in seconds
        refresh_token:
          type: string
          description: Rotation-enabled refresh token
    MeResponse:
      type: object
      description: |
        The authenticated caller's safe profile. Only profile fields and the
        identity's authorization role are returned; password hashes,
        refresh-token material and internal database fields are never exposed.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: ["founder", "workspace_admin", "workspace_member"]
        is_founder:
          type: boolean
        workspace_id:
          type: string
          format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication and session management
  - name: Workspaces
    description: Workspace management operations
  - name: Departments
    description: Department management operations
  - name: Teams
    description: Team management operations
  - name: AI Employees
    description: AI Employee management operations
  - name: Audit
    description: Audit and compliance operations
  - name: Constitutional
    description: Constitutional principle management
surveillance:
  # Principle references must appear in every endpoint above
  # 100% coverage gate in CI