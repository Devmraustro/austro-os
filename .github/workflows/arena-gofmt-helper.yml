name: Arena temporary Go formatter
on:
  push:
    branches: [arena/01a0a5ea-austro-os]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Format and archive Go sources
        run: |
          set -euo pipefail
          gofmt -w $(find . -name '*.go' -type f -not -path './.git/*')
          tar -czf /tmp/formatted-go.tgz $(find . -name '*.go' -type f -not -path './.git/*')
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-go-sources
          path: /tmp/formatted-go.tgz
