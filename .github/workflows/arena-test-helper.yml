name: Arena temporary Go test helper
on:
  push:
    branches: [arena/01a0a5ea-austro-os]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run tests and expose failures
        run: |
          set +e
          go test ./internal/... 2>&1 | tee /tmp/go-test.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 60000 /tmp/go-test.txt | tr '\n' ' ')
            echo "::error title=go test failure::$msg"
            exit "$code"
          fi
