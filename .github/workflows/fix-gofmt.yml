name: Fix gofmt
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ab5b-austro-os]
    paths:
      - '.github/workflows/fix-gofmt.yml'

jobs:
  gofmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0ab5b-austro-os
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - name: Run gofmt -w
        run: |
          gofmt -l . > /tmp/list || true
          cat /tmp/list
          gofmt -w .
          git diff --name-only
      - name: Commit and push if needed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: auto gofmt via fix-gofmt workflow"
            git push origin arena/01a0ab5b-austro-os
          else
            echo "already clean"
          fi
