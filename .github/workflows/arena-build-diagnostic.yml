name: Arena temporary build diagnostic
on:
  push:
    branches: [arena/01a0a5ea-austro-os]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build packages
        run: go build ./... > build.log 2>&1
      - name: Upload build output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: arena-build-output
          path: build.log
