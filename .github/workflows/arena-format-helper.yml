name: Arena temporary format helper
on:
  push:
    branches: [arena/01a0a5ea-austro-os]
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0a5ea-austro-os
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Format production and tests except frozen gate
        run: |
          files=$(gofmt -l . | awk '$0 != "tests/phase1_exit_criteria_test.go"')
          if [ -n "$files" ]; then
            echo "$files" | xargs gofmt -w
            git config user.name 'arena-format-helper'
            git config user.email 'arena-format-helper@users.noreply.github.com'
            git add -A
            git commit -m 'chore: format creator pipeline tests'
            git push origin HEAD:arena/01a0a5ea-austro-os
          fi
