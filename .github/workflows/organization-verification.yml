name: Organization Independent Verification

on:
  push:
    branches: [arena/01a0ab5b-austro-os]
  pull_request:

permissions:
  contents: read

jobs:
  mutation:
    name: Organization mutation tests (${{ matrix.mutation }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mutation: [rbac, team_without_dept, employee_without_team, workspace, cross_parent, unauthorized_move, uniqueness, audit, route, browser]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: Run organization security-critical mutation suite
        env:
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -o pipefail
          chmod +x scripts/organization-mutation.sh
          set +e
          MUTATION_ONLY="${{ matrix.mutation }}" scripts/organization-mutation.sh > /tmp/mutation.log 2>&1
          status=$?
          set -e
          cat /tmp/mutation.log
          if [ "$status" -ne 0 ]; then
            if grep -E '^(FINAL_DIFF_START|FINAL_DIFF_END|diff --|@@ |[-+][^+-]|BEGIN mutation|MUTATION TARGET FAILED|=== mutation|CAUGHT:|SURVIVED:|RESTORED|RESTORE FAILED|mutation target|--- FAIL|FAIL|panic:|expected)' /tmp/mutation.log; then
              while IFS= read -r line; do
                echo "::error title=mutation-suite::$line"
              done < <(grep -E '^(FINAL_DIFF_START|FINAL_DIFF_END|diff --|@@ |[-+][^+-]|BEGIN mutation|MUTATION TARGET FAILED|=== mutation|CAUGHT:|SURVIVED:|RESTORED|RESTORE FAILED|mutation target|--- FAIL|FAIL|panic:|expected)' /tmp/mutation.log)
            fi
          fi
          exit "$status"
