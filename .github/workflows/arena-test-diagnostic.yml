name: Arena temporary test diagnostic
on:
  push:
    branches: [arena/01a0a5ea-austro-os]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run unit tests
        run: |
          if ! go test ./internal/... ./cmd/... ./infrastructure/... . -count=1 > test.log 2>&1; then
            while IFS= read -r line; do
              echo "::error file=test::$line"
            done < test.log
            exit 1
          fi
