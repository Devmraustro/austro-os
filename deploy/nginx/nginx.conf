# AUSTRO OS — nginx HTTPS reverse proxy (complete nginx.conf).
#
# Mounted read-only over /etc/nginx/nginx.conf by the `reverse-proxy` service in
# docker-compose.production.yml. It is the whole configuration, not a fragment,
# so the running proxy is exactly this file plus the official image.
#
#   Internet --80/443--> nginx --austro_edge--> api:8080
#
# CONFIGURATION REQUIRED before the first start:
#   /etc/nginx/tls/fullchain.pem   (inside the container)
#   /etc/nginx/tls/privkey.pem
# Those paths are backed by the host directory named in AUSTRO_TLS_CERT_DIR
# (default ./deploy/tls). nginx exits immediately if either file is missing, so
# a misconfigured mount fails the container rather than serving plaintext.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Do not advertise the exact nginx version in responses or error pages: it
    # turns a targeted exploit search into a one-line curl.
    server_tokens off;

    # -----------------------------------------------------------------------
    # Request size and header bounds
    # -----------------------------------------------------------------------
    # The Go application caps every request body at 1 MiB
    # (http.MaxBytesReader, internal/api/handler.go). The proxy limit must stay
    # ABOVE that: if the proxy rejected first, the effective contract would be
    # the proxy's limit, not the application's, and a client at the application
    # boundary would receive a proxy-level 413 that the application never had a
    # chance to explain.
    client_max_body_size 2m;

    # A slow or stalled client must not hold a connection open indefinitely.
    # These mirror the application's own 10s read-header and 30s read bounds.
    client_header_timeout  10s;
    client_body_timeout    30s;
    large_client_header_buffers 4 16k;

    # -----------------------------------------------------------------------
    # Upstream
    # -----------------------------------------------------------------------
    # `api` is the compose service name; nginx resolves it on austro_edge.
    # keepalive means a burst of requests does not open a new TCP connection to
    # the API per request (the paired `proxy_set_header Connection ""` in the
    # location blocks is what actually enables it).
    upstream austro_api {
        server api:8080;
        keepalive 16;
    }

    # -----------------------------------------------------------------------
    # HTTP — redirect only. No application content is ever served over plaintext.
    # -----------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # `$host` is preserved so a request for the configured hostname lands on
        # the same hostname over HTTPS. This also serves ACME HTTP-01 if the
        # Caddy profile is used later.
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # HTTPS
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        # CONFIGURATION REQUIRED — see the header of this file.
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        # TLS 1.2 is the floor: 1.0 and 1.1 are refused rather than negotiated
        # down to. Cipher suite list is ECDHE-only, so no dhparam file is
        # required and no non-forward-secret suite is offered.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        # The client's preference is honoured for TLS 1.2; with TLS 1.3 the
        # ordering is fixed by the protocol itself.
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        # Tickets are disabled: without rotation they weaken forward secrecy.
        ssl_session_tickets off;

        # A certificate must be renewed before it expires; once a browser has
        # seen this header it will refuse the plaintext redirect an expired
        # certificate would otherwise fall back to.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # The API answers with JSON, never with a document that should be
        # interpreted as another type.
        add_header X-Content-Type-Options "nosniff" always;
        # The application is not designed to be embedded in a third-party page.
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # Isolates the browsing context from cross-origin openers.
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # NOTE: no Content-Security-Policy is set here. The embedded browser
        # application has not been audited against a specific policy, and a
        # wrong CSP breaks the UI in a way that looks like an application bug.
        # See docs/production-configuration.md — adding a reviewed CSP is a
        # documented follow-up, not something to guess at.

        # -------------------------------------------------------------------
        # Proxy behaviour
        # -------------------------------------------------------------------
        proxy_http_version 1.1;

        # Timeouts. proxy_read_timeout matches the application's own 60s write
        # timeout: longer would let the proxy wait for a response the API has
        # already given up on, shorter would abandon responses the API is still
        # legitimately producing.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering off for the small JSON responses keeps latency predictable
        # and avoids holding request bodies in proxy memory.
        proxy_buffering off;
        proxy_request_buffering on;

        # -------------------------------------------------------------------
        # Forwarded headers — client-supplied values are DISCARDED, not appended
        # -------------------------------------------------------------------
        # This proxy is the only ingress. There is no trusted upstream hop in
        # front of it, so any X-Forwarded-* value that arrived from the internet
        # is attacker-controlled. `$proxy_add_x_forwarded_for` (the common
        # default) would APPEND to that client value, letting a caller choose
        # what a downstream log or access rule believes their address is. Each
        # header is therefore overwritten with a value this proxy observed.
        #
        # The application itself takes none of these on trust: authorization is
        # decided from verified JWT claims, never from a client-supplied address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Enables the upstream keepalive pool declared above.
        proxy_set_header Connection "";

        # -------------------------------------------------------------------
        # Health probes — no access-log noise, same upstream as everything else
        # -------------------------------------------------------------------
        location = /health/live {
            access_log off;
            proxy_pass http://austro_api;
        }

        location = /health/ready {
            access_log off;
            proxy_pass http://austro_api;
        }

        # -------------------------------------------------------------------
        # Application
        # -------------------------------------------------------------------
        location / {
            proxy_pass http://austro_api;
        }
    }
}
