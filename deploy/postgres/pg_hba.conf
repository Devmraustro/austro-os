# AUSTRO OS — PostgreSQL host authentication.
#
# This file is the authoritative pg_hba.conf for the production deployment. It
# is mounted read-only into the postgres container at
# /etc/postgresql/pg_hba.conf and selected with
#
#   postgres -c hba_file=/etc/postgresql/pg_hba.conf
#
# hba_file is a postmaster-start GUC, so this file is applied at every postgres
# start and survives both container recreation and an already-seeded
# postgres_data volume — it does not depend on initdb, which only runs once.
#
# The image's initdb default hardcodes loopback TCP as `trust`, which would
# silently accept ANY password on 127.0.0.1 — the exact path
# scripts/healthcheck.sh uses to authenticate the runtime role. That is the
# bug this file exists to remove: the runtime credential must be verified,
# not round-tripped.
#
# Line-by-line contract:
#   local  all all trust                      Operator and backup path. The Unix
#                                             socket is reachable only inside the
#                                             postgres container, so
#                                             scripts/backup.sh / restore.sh /
#                                             operator sessions need no stored
#                                             credential (see docs/backups-and-restore.md).
#   host   all all 127.0.0.1/32 scram-sha-256 Loopback TCP must authenticate.
#   host   all all ::1/128      scram-sha-256 Same, IPv6.
#   host   all all all          scram-sha-256 Every other source — the API and
#                                             worker on the private network —
#                                             already authenticates via the DSNs.
#
# Keep the password hashes in sync: roles are provisioned by
# infrastructure/database with ALTER ROLE ... PASSWORD, which stores a
# scram-sha-256 verifier on PostgreSQL 16 (password_encryption default), so
# scram-sha-256 here is the matching method.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             all                     scram-sha-256