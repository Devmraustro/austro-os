# Browser E2E-only override. The base Redis healthcheck cannot authenticate to
# a requirepass-protected server; passing REDISCLI_AUTH keeps the healthcheck
# real without weakening the runtime password requirement.
services:
  redis:
    environment:
      REDISCLI_AUTH: ${AUSTRO_REDIS_PASSWORD:?AUSTRO_REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
